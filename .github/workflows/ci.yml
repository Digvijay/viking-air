name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VikingAir.sln

      - name: Build
        run: dotnet build VikingAir.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test VikingAir.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

  benchmarks-smoke:
    name: Benchmarks execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A dry job proves the benchmarks still compile and that their correctness guards
      # hold - in particular that a Sannr validator is actually registered for the model.
      # It does not produce publishable timings.
      - name: Run benchmarks in dry mode
        run: dotnet run --configuration Release --project VikingAir.Benchmarks -- --job dry --filter '*'

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VikingAir.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: VikingAir.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
