name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main", "master", "development" ]
  pull_request:
    branches: [ "main", "master", "development" ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Branch to build in each toolkit library; libraries without it fall back to their default
  # branch. Using one branch name across repositories tests a cross-repository change end to end.
  TOOLKIT_REF: ${{ github.head_ref || github.ref_name }}

jobs:
  build:
    name: Build & Test (.NET 8 LTS + .NET 10)
    # x64 Linux and x64 Windows. Culture, path-separator and line-ending defects have all been
    # found in these repositories; a single-OS matrix cannot see any of them.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v7
        with:
          # Required: Nerdbank.GitVersioning walks history to compute version height and
          # hard-fails on a shallow clone.
          fetch-depth: 0

      - name: Setup .NET (8.0 LTS and 10.0)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build toolkit libraries from source
        # Viking Air integrates the libraries' current source, not their last release: it depends
        # on fixes that are not yet published, and a pinned public version would hide regressions.
        shell: pwsh
        run: ./eng/build-libraries.ps1
      - name: Restore
        run: dotnet restore VikingAir.sln --configfile .toolkit/nuget.config

      - name: Build
        run: dotnet build VikingAir.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test VikingAir.sln --no-build --configuration Release
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-coverage-${{ matrix.os }}
          path: ./coverage

  web:
    name: Web build & lint (VikingAir.Web)
    runs-on: ubuntu-latest
    # The front end was invisible to CI. Dependabot opened npm pull requests - including
    # major bumps of TypeScript, ESLint and lucide-react - and every check on them reported
    # green, because every check was a .NET job. Nothing compiled or linted this project at
    # all, so "all checks passed" on a front-end change meant only that the back end still
    # built. This job is what makes those results mean something.
    defaults:
      run:
        working-directory: VikingAir.Web

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: VikingAir.Web/package-lock.json

      # ci, not install: it installs exactly what package-lock.json pins and fails if the
      # lock file and package.json disagree, so a Dependabot pull request cannot pass by
      # silently resolving to something other than what it proposes to commit.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs tsc -b before vite build, so this is a type check as well as a bundle.
      - name: Build
        run: npm run build

  preview:
    name: Preview .NET (net11.0)
    runs-on: ubuntu-latest
    # Advisory. A preview SDK can regress for reasons outside this repository, so this leg
    # reports breakage without blocking the merge queue.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET (8.0, 10.0 and 11.0 preview)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Report SDK version
        run: dotnet --info

      - name: Build toolkit libraries from source
        # Viking Air integrates the libraries' current source, not their last release: it depends
        # on fixes that are not yet published, and a pinned public version would hide regressions.
        shell: pwsh
        run: ./eng/build-libraries.ps1
      - name: Restore (including net11.0)
        env:
          INCLUDE_PREVIEW_TFM: 'true'
        run: dotnet restore VikingAir.sln --configfile .toolkit/nuget.config

      - name: Build (including net11.0)
        env:
          INCLUDE_PREVIEW_TFM: 'true'
        run: dotnet build VikingAir.sln --no-restore --configuration Release

      - name: Test (including net11.0)
        env:
          INCLUDE_PREVIEW_TFM: 'true'
        run: dotnet test VikingAir.sln --no-build --configuration Release
