name: Native AOT validation

# Proves the Native AOT claim instead of asserting it: publishes a real consumer
# with PublishAot=true, then executes the produced native binary.

permissions:
  contents: read

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  aot-publish-and-run:
    name: AOT publish and run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install AOT native toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Build toolkit libraries from source
        # See ci.yml: Viking Air integrates the libraries' current source, not their last release.
        shell: pwsh
        run: ./eng/build-libraries.ps1
        env:
          TOOLKIT_REF: ${{ github.head_ref || github.ref_name }}

      - name: Restore for Native AOT
        run: dotnet restore VikingAir.Api/VikingAir.Api.csproj --configfile .toolkit/nuget.config

      - name: Publish with Native AOT
        run: >
          dotnet publish VikingAir.Api/VikingAir.Api.csproj
          --no-restore
          --configuration Release
          --framework net10.0
          -p:TreatWarningsAsErrors=true
          -p:TrimmerSingleWarn=false
          --output ./aot-output

      - name: Execute the native binary
        shell: bash
        run: |
          set -e
          binary=$(find ./aot-output -maxdepth 1 -type f \( -perm -u+x -o -name '*.exe' \) ! -name '*.pdb' ! -name '*.json' ! -name '*.dbg' | head -n 1)
          if [ -z "$binary" ]; then
            echo "::error::No native executable was produced."
            ls -R ./aot-output
            exit 1
          fi
          echo "Running $binary"
          "$binary"

      - name: Report native binary size
        shell: bash
        run: |
          echo "### Native AOT output (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh ./aot-output | head -n 25 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  trim-analysis:
    name: Trimming and AOT analyzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build toolkit libraries from source
        # See ci.yml: Viking Air integrates the libraries' current source, not their last release.
        shell: pwsh
        run: ./eng/build-libraries.ps1
        env:
          TOOLKIT_REF: ${{ github.head_ref || github.ref_name }}

      - name: Restore
        run: dotnet restore VikingAir.sln --configfile .toolkit/nuget.config

      - name: Build with AOT and trim analyzers as errors
        run: >
          dotnet build VikingAir.sln
          --no-restore
          --configuration Release
          -p:EnableAotAnalyzer=true
          -p:EnableTrimAnalyzer=true
          -p:EnableSingleFileAnalyzer=true
          -p:WarningsAsErrors=IL2026%3BIL2046%3BIL2062%3BIL2067%3BIL2070%3BIL2072%3BIL2075%3BIL2087%3BIL2091%3BIL3050%3BIL3051%3BIL3052%3BIL3053
