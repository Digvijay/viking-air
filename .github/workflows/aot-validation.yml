name: Native AOT validation

# Proves the Native AOT claim instead of asserting it: publishes a real consumer
# with PublishAot=true, then executes the produced native binary.

permissions:
  contents: read

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  aot-publish-and-run:
    name: AOT publish and run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Without this the smoke test below could hang until GitHub's 6-hour default. The API
    # is a web host, so the binary does not exit on its own.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install AOT native toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Build toolkit libraries from source
        # See ci.yml: Viking Air integrates the libraries' current source, not their last release.
        shell: pwsh
        run: ./eng/build-libraries.ps1
        env:
          TOOLKIT_REF: ${{ github.head_ref || github.ref_name }}

      - name: Restore for Native AOT
        run: dotnet restore VikingAir.Api/VikingAir.Api.csproj --configfile .toolkit/nuget.config

      - name: Publish with Native AOT
        # TreatWarningsAsErrors stays ON so ordinary compiler warnings in Viking Air's own
        # code still fail the publish. Only ILC's trim/AOT warnings are demoted back to
        # warnings, because two third-party dependencies emit warnings this repository
        # cannot fix - failing on every one would mean the gate could never be green, and
        # ignoring them would let a real regression through. The publish output is captured
        # and checked against a reviewed baseline in the next step, which fails on anything
        # new. See eng/aot-baseline.txt.
        shell: bash
        run: |
          set -o pipefail
          dotnet publish VikingAir.Api/VikingAir.Api.csproj \
            --no-restore \
            --configuration Release \
            --framework net10.0 \
            -p:TreatWarningsAsErrors=true \
            -p:IlcTreatWarningsAsErrors=false \
            -p:TrimmerSingleWarn=false \
            --output ./aot-output 2>&1 | tee aot-publish.log

      - name: Check trim/AOT warnings against the reviewed baseline
        shell: pwsh
        run: ./eng/check-aot-warnings.ps1 -LogPath aot-publish.log -BaselinePath eng/aot-baseline.txt

      - name: Smoke-test the native binary
        # This step used to run the binary in the foreground and wait for it to exit. That
        # was never reached, because the publish always failed first. The moment the
        # baseline check made publication succeed, it hung: VikingAir.Api is a web host, so
        # `app.Run()` blocks forever and the job would have burned until the 6-hour cap.
        #
        # It now does what the step was always meant to prove - that the natively compiled
        # binary actually serves traffic. Starting is a weak claim: a Native AOT failure
        # typically surfaces on the first request, when a formatter or serializer that ILC
        # could not see is finally needed. So the test exercises the real booking endpoint,
        # which is the one path that uses Sannr, Rapp and AutoMappic together, and also
        # sends an invalid payload to confirm validation still rejects it rather than
        # silently passing.
        #
        # ASPNETCORE_ENVIRONMENT=Development is set because MapDefaultEndpoints only maps
        # /health outside production.
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
        run: |
          set -euo pipefail

          binary=$(find ./aot-output -maxdepth 1 -type f \( -perm -u+x -o -name '*.exe' \) ! -name '*.pdb' ! -name '*.json' ! -name '*.dbg' | head -n 1)
          if [ -z "$binary" ]; then
            echo "::error::No native executable was produced."
            ls -R ./aot-output
            exit 1
          fi
          echo "Starting $binary"

          "$binary" > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 40); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::The native binary exited during startup."
              cat server.log
              exit 1
            fi
            if curl --silent --fail http://127.0.0.1:5080/health > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::The native binary did not become healthy within 40s."
            cat server.log
            exit 1
          fi
          echo "Health check passed."

          # A valid booking must be accepted and must come back mapped and confirmed.
          body=$(curl --silent --show-error --fail-with-body \
            -X POST http://127.0.0.1:5080/api/book \
            -H 'Content-Type: application/json' \
            -d '{"flightCode":" ba123 ","passportNumber":"x1234567","seatPreference":"Window"}')
          echo "Response: $body"

          case "$body" in
            *Confirmed*) ;;
            *) echo "::error::Booking was not confirmed. Response: $body"; cat server.log; exit 1 ;;
          esac

          # Sanitization is source-generated, so prove it actually ran in the native binary.
          case "$body" in
            *BA123*) ;;
            *) echo "::error::Sannr sanitization did not run: expected the flight code upper-cased. Response: $body"; cat server.log; exit 1 ;;
          esac

          # An invalid payload must be rejected. If this returns 200 the validation filter
          # has silently stopped running - the exact defect Sannr 1.7.0 was released to fix.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://127.0.0.1:5080/api/book \
            -H 'Content-Type: application/json' \
            -d '{"flightCode":"","passportNumber":"x","seatPreference":"Spaceship"}')

          if [ "$status" != "400" ]; then
            echo "::error::Invalid payload returned HTTP $status, expected 400. Validation is not running."
            cat server.log
            exit 1
          fi
          echo "Invalid payload correctly rejected with 400."

          echo "Native binary served traffic correctly."

      - name: Report native binary size
        shell: bash
        run: |
          echo "### Native AOT output (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh ./aot-output | head -n 25 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  trim-analysis:
    name: Trimming and AOT analyzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build toolkit libraries from source
        # See ci.yml: Viking Air integrates the libraries' current source, not their last release.
        shell: pwsh
        run: ./eng/build-libraries.ps1
        env:
          TOOLKIT_REF: ${{ github.head_ref || github.ref_name }}

      - name: Restore
        run: dotnet restore VikingAir.sln --configfile .toolkit/nuget.config

      - name: Build with AOT and trim analyzers as errors
        run: >
          dotnet build VikingAir.sln
          --no-restore
          --configuration Release
          -p:EnableAotAnalyzer=true
          -p:EnableTrimAnalyzer=true
          -p:EnableSingleFileAnalyzer=true
          -p:WarningsAsErrors=IL2026%3BIL2046%3BIL2062%3BIL2067%3BIL2070%3BIL2072%3BIL2075%3BIL2087%3BIL2091%3BIL3050%3BIL3051%3BIL3052%3BIL3053
