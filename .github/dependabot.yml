version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      test-dependencies:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/VikingAir.Web"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      # These six cannot move independently. typescript-eslint peer-depends on both
      # eslint and typescript, and @eslint/js must match eslint's major. Dependabot
      # raised @eslint/js 10 and typescript 7 as separate pull requests and both died
      # in npm ci with ERESOLVE, because each one alone contradicts the peers of a
      # package it shares the tree with. Grouped, they are proposed as one coordinated
      # upgrade that can actually resolve, install and lint.
      lint-and-types:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      # Same reasoning: @vitejs/plugin-react declares a peer range over vite majors, so
      # bumping vite alone fails to install. vite 8 was proposed on its own and could
      # not resolve against plugin-react 5.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
    ignore:
      # typescript-eslint 8.x - the newest line there is - still does not accept
      # TypeScript 7 as a peer, so grouping was not enough: the grouped upgrade also
      # failed to install. This is an upstream gap, not a constraint of this project.
      # Holding TypeScript at 5.x until typescript-eslint supports 7 keeps the lint and
      # type-check legs working; minor and patch updates still come through. Remove this
      # entry once typescript-eslint publishes support.
      - dependency-name: "typescript"
        update-types: [ "version-update:semver-major" ]
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # global.json pins the SDK the stable build uses. Dependabot proposed
    # 11.0.100-rc.1 as an ordinary bump, which failed every job except the one
    # deliberately running a preview SDK - the pin is what keeps the stable legs
    # stable, so a prerelease major cannot go in it. The net11.0 preview leg is how
    # this repository tracks the next SDK; it installs its own and needs no pin.
    # Patch and minor updates within the current major are still wanted.
    ignore:
      - dependency-name: "dotnet-sdk"
        update-types: [ "version-update:semver-major" ]
