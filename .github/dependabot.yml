version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      test-dependencies:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/VikingAir.Web"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      # These six cannot move independently. typescript-eslint peer-depends on both
      # eslint and typescript, and @eslint/js must match eslint's major. Dependabot
      # raised @eslint/js 10 and typescript 7 as separate pull requests and both died
      # in npm ci with ERESOLVE, because each one alone contradicts the peers of a
      # package it shares the tree with. Grouped, they are proposed as one coordinated
      # upgrade that can actually resolve, install and lint.
      lint-and-types:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # global.json pins the SDK the stable build uses. Dependabot proposed
    # 11.0.100-rc.1 as an ordinary bump, which failed every job except the one
    # deliberately running a preview SDK - the pin is what keeps the stable legs
    # stable, so a prerelease major cannot go in it. The net11.0 preview leg is how
    # this repository tracks the next SDK; it installs its own and needs no pin.
    # Patch and minor updates within the current major are still wanted.
    ignore:
      - dependency-name: "dotnet-sdk"
        update-types: [ "version-update:semver-major" ]
